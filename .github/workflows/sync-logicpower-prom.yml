name: Sync LogicPower to Prom

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync LogicPower prices and availability to Prom
        env:
          LOGICPOWER_API_KEY: ${{ secrets.LOGICPOWER_API_KEY }}
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
        run: python3 sync_logicpower_to_prom.py
