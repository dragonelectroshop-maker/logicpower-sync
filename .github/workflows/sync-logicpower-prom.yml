name: Sync LogicPower to Prom

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run LogicPower synchronization
        env:
          LOGICPOWER_API_KEY: ${{ secrets.LOGICPOWER_API_KEY }}
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
        run: python sync_logicpower_to_prom.py
