name: Test Prom API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Prom API connection
        env:
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
        run: python3 test_prom_api.py
